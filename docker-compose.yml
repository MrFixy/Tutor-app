version: "3.9"

# Only Postgres is dockerized. Ollama is installed natively (see README
# Section 6) so it has direct access to your GPU -- running it inside
# Docker on most setups just adds passthrough headaches for no benefit
# at this stage.

services:
  postgres:
    image: postgres:16
    container_name: tutor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: tutor_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
